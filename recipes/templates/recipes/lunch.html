{% extends 'base.html' %}

{% block content %}
<div class="page-header mb-4">
    <h1>Lunch</h1>
    <p>Fresh seafood dishes to fuel your afternoon.</p>
</div>

<div class="row">
    {% for meal in meals %}
        <div class="col-md-4 col-lg-3 mb-4">
            <div class="food-card h-100">
                <img src="{{ meal.strMealThumb }}" alt="{{ meal.strMeal }}">
                <div class="card-body">
                    <h5 class="card-title">{{ meal.strMeal }}</h5>
                </div>
                <div class="card-footer">
                    <a href="{% url 'meal_detail' meal.idMeal %}" class="btn btn-primary btn-sm">View Recipe</a>
                </div>
            </div>
        </div>
    {% endfor %}
</div>
{% endblock %}
