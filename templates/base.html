<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viens Manger</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8d6e3;
        }

        .recipe-card img {
            height: 220px;
            object-fit: cover;
        }
    

        .hero-box {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 2px 12px rgba(178, 247, 218, 0.938);
        }

        .navbar {
            background-color: #f2ecf5 !important;
        }

        .navbar-brand,
        .nav-link,
        .navbar-text {
            color: #4a4a4a !important;
        }

        .nav-link:hover {
            color: #6d597a !important;
        }

        .dropdown-menu {
            background-color: #a7f8e0;
            border: none;
        }

        .dropdown-item {
            color: #4a4a4a;
        }

        .dropdown-item:hover {
            background-color: #ffafcc;
            color: #4a4a4a;
        }

        .btn-outline-light {
            border-color: #aeffdd;
            color: #4a4a4a;
        }

        .btn-outline-light:hover {
            background-color: #9efce7;
            color: #4a4a4a;
        }

        .btn-light {
            background-color: #a2d2ff;
            border: none;
            color: #4a4a4a;
        }

        .btn-light:hover {
            background-color: #90caff;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'home' %}">Viens Manger</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'today_special' %}">Today's Special</a>
                    </li>

                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="categoryDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            Categories
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="categoryDropdown">
                            <li><a class="dropdown-item" href="{% url 'breakfast' %}">Breakfast</a></li>
                            <li><a class="dropdown-item" href="{% url 'lunch' %}">Lunch</a></li>
                            <li><a class="dropdown-item" href="{% url 'dinner' %}">Dinner</a></li>
                        </ul>
                    </li>
                </ul>

                <form class="d-flex me-2" method="GET" action="{% url 'search' %}">
                    <input class="form-control form-control-sm me-1" type="search" name="q" placeholder="Search recipes..." value="{{ request.GET.q }}">
                    <button class="btn btn-outline-light btn-sm" type="submit">Search</button>
                </form>

                <div class="d-flex align-items-center gap-2">
                    {% if request.user.is_authenticated %}
                        <a class="btn btn-outline-light btn-sm" href="{% url 'add_recipe' %}">Add Recipe</a>
                        <span class="navbar-text text-light">{{ request.user.username }}</span>
                        <form method="POST" action="{% url 'logout' %}" class="d-inline m-0">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
                        </form>
                    {% else %}
                        <a class="btn btn-outline-light btn-sm" href="{% url 'login' %}">Login</a>
                        <a class="btn btn-light btn-sm" href="{% url 'register' %}">Register</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
